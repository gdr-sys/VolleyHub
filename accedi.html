<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accedi · VolleyHub</title>
  <meta name="theme-color" content="#13213F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="css/vh.css">
  <style>
    body { min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; }
    .side { background: #13213F; color: #fff; padding: 48px; display: grid; align-content: space-between; gap: 32px; position: relative; overflow: hidden; }
    .side .brand { color: #fff; }
    .side h1 { font-size: clamp(30px, 3.4vw, 46px); color: #fff; max-width: 14ch; line-height: 1.08; }
    .side p { color: #B9C4DD; max-width: 40ch; margin-top: 14px; }
    .side .court { position: absolute; right: -120px; bottom: -120px; width: 420px; opacity: .14; }
    .main { display: grid; place-items: center; padding: 32px 20px; }
    form { width: min(380px, 100%); display: grid; gap: 16px; }
    form h2 { font-size: 26px; }
    .pwd { position: relative; }
    .pwd .input { padding-right: 48px; }
    .pwd button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
    .msg { display: none; }
    .msg.show { display: block; }
    .links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
    .links button { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-weight: 600; }
    .alt { border-top: 1px solid var(--line); padding-top: 16px; text-align: center; font-size: 14px; color: var(--muted); }
    @media (max-width: 820px) { body { grid-template-columns: 1fr; } .side { padding: 24px 20px; } .side h1, .side p, .side .court { display: none; } }
  </style>
</head>
<body>
  <aside class="side">
    <a class="brand" href="index.html"><img src="assets/logo-mark.svg" alt="" width="30" height="30">VolleyHub</a>
    <div><h1>Il torneo, dal primo girone al podio.</h1><p>Gironi, risultati e classifiche in tempo reale, con la pagina live per genitori e pubblico.</p></div>
    <img class="court" src="assets/logo-mark.svg" alt="">
  </aside>
  <main class="main">
    <form id="f" novalidate>
      <h2>Accedi</h2>
      <p class="note note-warn msg" id="m-inattivo">Il tuo account non è ancora attivo. Scrivi a <a href="mailto:noemi.marcolini@gmail.com">noemi.marcolini@gmail.com</a> per attivarlo.</p>
      <p class="note note-err msg" id="m-err" role="alert"></p>
      <p class="note note-ok msg" id="m-ok" role="status"></p>
      <label class="field"><span>Email</span><input class="input" id="email" type="email" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span>
        <span class="pwd"><input class="input" id="pwd" type="password" autocomplete="current-password" required>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" id="show" aria-label="Mostra la password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
      <button class="btn btn-primary btn-lg" type="submit" id="go">Accedi</button>
      <div class="links"><button type="button" id="reset">Ho dimenticato la password</button></div>
      <p class="alt">Vuoi solo dare un'occhiata? <a href="app.html?demo=1">Prova la demo</a></p>
    </form>
  </main>
  <script type="module">
    import { getStore } from './js/store.js';
    import { applicaTema } from './js/ui.js';
    applicaTema();
    const $ = id => document.getElementById(id);
    const mostra = (id, testo) => { ['m-err', 'm-ok', 'm-inattivo'].forEach(k => $(k).classList.remove('show')); if (id) { if (testo) $(id).textContent = testo; $(id).classList.add('show'); } };
    if (new URLSearchParams(location.search).get('motivo') === 'inattivo') mostra('m-inattivo');
    const ERRORI = {
      'auth/invalid-credential': 'Email o password non corretti.', 'auth/wrong-password': 'Email o password non corretti.',
      'auth/user-not-found': 'Non esiste un account con questa email.', 'auth/invalid-email': 'L\'indirizzo email non è valido.',
      'auth/too-many-requests': 'Troppi tentativi. Riprova tra qualche minuto.', 'auth/network-request-failed': 'Connessione assente. Riprova.',
      'auth/user-disabled': 'Questo account è stato disattivato.',
    };
    let store;
    try { store = await getStore(); } catch { mostra('m-err', 'Connessione assente. Controlla la rete e ricarica.'); }
    let entrando = false;
    store?.onUser(async u => {
      if (!u || u.anon || entrando) return;
      try { if (await store.isActive(u.uid)) location.replace('app.html'); } catch { /* resta sul modulo */ }
    });
    $('show').onclick = () => { const p = $('pwd'), vis = p.type === 'password'; p.type = vis ? 'text' : 'password'; $('show').setAttribute('aria-pressed', vis); $('show').setAttribute('aria-label', vis ? 'Nascondi la password' : 'Mostra la password'); };
    $('f').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('email').value.trim(), pwd = $('pwd').value;
      if (!email || !pwd) { mostra('m-err', 'Inserisci email e password.'); (!email ? $('email') : $('pwd')).focus(); return; }
      $('go').disabled = true; $('go').textContent = 'Accesso in corso…'; mostra();
      entrando = true;
      try {
        await store.login(email, pwd);
        const u = await new Promise(r => { const off = store.onUser(x => { if (x && !x.anon) { off?.(); r(x); } }); });
        if (await store.isActive(u.uid)) { location.replace('app.html'); return; }
        await store.logout();
        mostra('m-inattivo');
      } catch (err) {
        mostra('m-err', ERRORI[err.code] || 'Accesso non riuscito. Riprova.');
      }
      entrando = false;
      $('go').disabled = false; $('go').textContent = 'Accedi';
    });
    $('reset').onclick = async () => {
      const email = $('email').value.trim();
      if (!email) { mostra('m-err', 'Scrivi la tua email qui sopra: ti mandiamo il link per scegliere una nuova password.'); $('email').focus(); return; }
      try { await store.resetPassword(email); mostra('m-ok', `Se ${email} è registrata, riceverai a breve un'email per reimpostare la password.`); }
      catch (err) { mostra('m-err', ERRORI[err.code] || 'Invio non riuscito. Riprova.'); }
    };
  </script>
</body>
</html>
